<style>
:root{
  /* Layout: a chart table — HUD strip, full-bleed sea chart, command bar; parchment orders slide up over the chart */
  --tar:#16110c; --plank:#231a12; --plank-2:#2e2318;
  --brass:#d3a64f; --brass-d:#8d6b2c;
  --parch:#ecdfbf; --parch-2:#ddcba1; --ink:#2a1f14; --ink-2:#6b5639;
  --fg:#efe3c8; --muted:#a8977a; --blood:#a8402c; --good:#4d7a3a; --guard:#3f6aa8;
  --f-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --f-body:"Alegreya",Georgia,"Times New Roman",serif;

  color-scheme:dark;
}
html,body{height:100%}

#app{height:100%;display:flex;flex-direction:column}

.chip b{font-size:15px;color:var(--fg);font-weight:700;margin-left:3px}

.bar{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1.35fr}
.bar .steer{font-size:22px;font-family:var(--f-display);touch-action:none;user-select:none;-webkit-user-select:none}
.bar .steer:active,.bar .steer.on{background:var(--brass-d)}
.arena{width:100%;height:min(48vh,400px);display:block;border-radius:3px;background:#1d4aa8;touch-action:none}
.bstats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 2px}
.bstats > div{min-width:0}

.bmsg{min-height:22px;font-size:15px;font-weight:600;margin:4px 0 8px}
.bctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}

.bctl button:active{background:var(--ink-2)}
.bctl .fire{background:var(--blood)}
.bctl .fire i{position:absolute;left:0;bottom:0;height:5px;background:var(--parch);width:100%}
.sndbtn{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));font-family:"Pixelify Sans",monospace;font-size:13px;color:#fff;background:rgba(10,20,40,.72);border:1px solid var(--brass);border-radius:2px;padding:6px 10px;min-height:36px;cursor:pointer}

<script>
(()=>{

    for(let i=1;i<=5;i++){if(Math.sin(T*8-i)>-.3){const d=14+i*8,w=2+i*.8;ctx.fillRect(S.x-cx*d-cy*w-2,S.y-cy*d+cx*w-2,4,4);ctx.fillRect(S.x-cx*d+cy*w-2,S.y-cy*d-cx*w-2,4,4);}}}
  topShip(ctx,S.x,S.y,S.heading,34,NAT[S.nat].c);
  ctx.restore();
  // mini-map
  const mw=Math.round(Math.min(150,W*.34)),mh=Math.round(mw*WH/WW),mx=W-mw-10,my=10;Object.assign(MM,{x:mx,y:my,w:mw,h:mh});
  ctx.fillStyle='#16110c';ctx.fillRect(mx-3,my-3,mw+6,mh+6);
  ctx.drawImage(world,mx,my,mw,mh);
  const f=mw/WW;
  for(const p of PORTS){ctx.fillStyle=NAT[p.nat].c;ctx.fillRect(mx+p.x*f-1.5,my+p.y*f-1.5,3,3);}
  if(S.treasure){ctx.fillStyle='#d8261b';ctx.fillRect(mx+S.treasure.x*f-2,my+S.treasure.y*f-2,4,4);}
  ctx.strokeStyle='#ffffff';ctx.lineWidth=1;ctx.strokeRect(mx+view.cx*f+.5,my+view.cy*f+.5,W*k*f,H*k*f);
  if(Math.floor(T*3)%2){ctx.fillStyle='#ff3b2f';ctx.fillRect(mx+S.x*f-2.5,my+S.y*f-2.5,5,5);}
  ctx.strokeStyle='#d3a64f';ctx.lineWidth=1.5;ctx.strokeRect(mx-1.5,my-1.5,mw+3,mh+3);

function drawWind(c,wx,wy){

  c.strokeStyle='#d3a64f';c.lineWidth=1;c.beginPath();c.arc(0,0,24,0,7);c.stroke();
  c.rotate(S.wind);c.fillStyle='#ffffff';c.beginPath();c.moveTo(15,0);c.lineTo(-10,-6);c.lineTo(-5,0);c.lineTo(-10,6);c.fill();
  c.restore();c.fillStyle='#ffffff';c.font='600 11px "Pixelify Sans",monospace';c.textAlign='center';c.fillText('WIND',wx,wy-29);c.textAlign='left';

/* ---------- sailing ---------- */
function update(dt){
  S.heading=wrapA(S.heading+steer*ship().turn*(S.skill==='nav'?1.1:1)*.85*dt);
  if(S.lastPort){const lp=PORT[S.lastPort];if(Math.hypot(lp.x-S.x,lp.y-S.y)>110)S.lastPort=null;}
  if(S.anchored){S.speed=0;return;}
  const sp=100*windF(S.heading)*ship().spd*(S.skill==='nav'?1.12:1)*(.55+.45*S.hull/ship().hull);
  const nx=S.x+Math.cos(S.heading)*sp*dt,ny=S.y+Math.sin(S.heading)*sp*dt;
  if(onLand(nx,ny)){S.speed=0;if(!S.aground){S.aground=true;sfx('thud');toast('Breakers ahead! Steer away from the coast.');}return;}
  S.aground=false;S.speed=sp;S.x=nx;S.y=ny;
  for(const p of PORTS){if(p.id!==S.lastPort&&Math.hypot(p.x-S.x,p.y-S.y)<40){openPort(p);return;}}
  if(S.treasure&&Math.hypot(S.treasure.x-S.x,S.treasure.y-S.y)<40){dig();return;}
  S.acc+=sp*dt/(24*WS);
  while(S.acc>=1&&!paused){S.acc-=1;newDay();}
}
function newDay(){
  S.day++;
  S.rations-=S.crew;
  if(S.rations<0){S.rations=0;S.morale=clamp(S.morale-2,0,100);const lost=Math.max(1,Math.floor(S.crew*.02));S.crew=Math.max(6,S.crew-lost);if(S.day%5===0)toast('The stores are empty. Men are going hungry.');}
  if(S.day%30===0)newMonth();
  if(S.calm>0){S.calm--;return;}
  if(!paused&&Math.random()<.036+S.fame*.0002)encounter();
}
function newMonth(){
  S.wind=Math.PI+rnd(-.7,.7);
  S.morale=clamp(S.morale-(S.skill==='wit'?1:2)+(S.gold/Math.max(1,S.crew)>40?2:0)-(S.gold/Math.max(1,S.crew)<4?2:0),0,100);
  refreshPorts();
  if(S.expect&&S.day>=S.expect)birth();
  if(month()%12===0){
    const k=pick(['en-fr','fr-nl','en-nl']);S.wars[k]=!S.wars[k];
    const[a,b]=k.split('-');const news=S.wars[k]?`War! ${NAT[a].n} and ${NAT[b].n} have declared war on one another.`:`${NAT[a].n} and ${NAT[b].n} have signed a peace.`;
    log(`New year's news: ${news}`);toast(news);
  }
  if(S.morale<=8&&S.crew>10){const lost=Math.floor(S.crew*.35);S.crew-=lost;S.morale=35;log(`Mutiny! ${lost} men seized a longboat and deserted.`);toast(`Mutiny! ${lost} men have deserted.`);}
  else if(S.morale<25&&Math.random()<.5)toast('The crew grumbles about their share of the plunder.');
  else toast(`The wind backs round. It now blows from the ${windFrom()}.`);
  if(age()>=60&&!S.oldWarn){S.oldWarn=true;toast('Your old bones ache. Perhaps it is time to retire.');}
  save();
}

/* ---------- encounters ---------- */
function genEnemy(){
  const r=Math.random(),hp=S.fame>20?Math.min(.18,.05+S.fame*.0015):0;
  const kind=r<hp?'hunter':r<hp+.48?'merchant':r<hp+.72?'warship':'pirate';
  let nat=null;
  if(kind==='hunter'){nat=NK.slice().sort((a,b)=>S.rel[a]-S.rel[b])[0];}
  else if(kind!=='pirate'){const q=Math.random();nat=q<.4?'es':q<.6?'en':q<.8?'fr':'nl';}
  let sh;
  if(kind==='merchant')sh=Math.random()<(nat==='es'?.3:.1)?'galleon':'barque';
  else if(kind==='warship')sh=Math.random()<.55?'brig':'frigate';
  else if(kind==='pirate')sh=Math.random()<.55?'sloop':'brig';
  else sh='frigate';
  const b=SHIPS[sh],ef=DIFF[S.diff].e;
  const gm={merchant:.55,warship:1,pirate:.9,hunter:1.1}[kind], cm={merchant:.4,warship:.85,pirate:1,hunter:.9}[kind];
  const gold=kind==='merchant'?(sh==='galleon'?ri(1800,4200):ri(300,900)):kind==='pirate'?ri(300,1100):ri(150,500);
  return {kind,nat,ship:sh,guns:Math.max(4,Math.round(b.guns*gm*(.8+ef*.2))),hull:b.hull,maxHull:b.hull,crew:Math.round(b.crew*cm*ef*rnd(.85,1.1)),
    gold,cargo:kind==='merchant'?Math.round(b.cargo*rnd(.4,.85)):ri(0,15),spd:b.spd,skill:{merchant:1.05,warship:.88,pirate:.92,hunter:.78}[kind],
    label:kind==='pirate'?`pirate ${b.n.toLowerCase()}`:kind==='hunter'?`${NAT[nat].a} pirate hunter`:kind==='merchant'&&sh==='galleon'?`${NAT[nat].a} treasure galleon`:`${NAT[nat].a} ${kind==='warship'?'man-of-war ':''}${b.n.toLowerCase()}`};
}
function aggressive(e){return e.kind==='pirate'&&Math.random()<.7||e.kind==='hunter'||(e.kind==='warship'&&S.rel[e.nat]<=-25);}
function encounter(){
  const e=genEnemy();e.aggr=aggressive(e);E=e;sfx('alarm');
  const flag=e.nat?`<span class="flag" style="background:${NAT[e.nat].c}"></span>${NAT[e.nat].n}`:'The black flag';
  const warn=e.nat&&S.rel[e.nat]>=0&&!atWar(S.nat,e.nat)?`<p class="note">Attacking her will sour ${NAT[e.nat].n}'s view of you${NK.some(n=>atWar(n,e.nat))?', but her enemies will thank you':''}.</p>`:
    e.nat?`<p class="note">${NK.filter(n=>atWar(n,e.nat)).map(n=>NAT[n].n).join(' and ')||'No one'} would reward you for taking her.</p>`:'<p class="note">Every crown pays well for a pirate taken.</p>';
  const say={merchant:'Her decks ride low. She is heavy with cargo.',warship:'Her gunports are open and her decks are crowded with marines.',pirate:'She flies no honest colors.',hunter:'Her captain carries a commission to bring you in, dead or in chains.'}[e.kind];
  sheet(`<p class="eyebrow">Sail ho!</p><h2>A ${e.label}</h2><p>${say} ${e.aggr?'<b>She is bearing down on you.</b>':''}</p>
  <dl class="stats"><dt>Colors</dt><dd>${flag}</dd><dt>Guns</dt><dd>${e.guns}</dd><dt>Crew</dt><dd>about ${Math.max(10,Math.round(e.crew/10)*10)}</dd><dt>Your ship</dt><dd>${S.crew} men, ${S.guns} guns, hull ${Math.round(S.hull/ship().hull*100)}%</dd></dl>
  ${warn}
  <div class="row"><button class="btn pri" data-a="engage">Engage</button>

}
A.pass=()=>{closeSheet();S.calm=2;};
A.evade=()=>{const p=clamp(.45*ship().spd/E.spd*(S.skill==='nav'?1.2:1),.12,.85);
  if(Math.random()<p){closeSheet();S.calm=3;toast('You slip away on the wind.');}
  else startBattle(true);};

/* ---------- sea battle (steer & fire) ---------- */
function reloadTime(guns,crew,mine){let t=4.4/clamp(crew/(guns*2.2),.35,1);if(mine&&S.skill==='gun')t*=.78;if(!mine)t/=DIFF[S.diff].e;return t;}
function startBattle(enemyFirst){
  const e=E,a=Math.random()*6.283,d=enemyFirst?200:340;
  B={e,t:0,steer:0,balls:[],fx:[],over:false,msgT:3,dead:1,
    msg:enemyFirst?`The ${e.label} runs out her guns!`:(e.kind==='merchant'?'She spots your colors and crowds on sail!':'Both ships beat to quarters!'),
    p:{x:0,y:0,h:S.heading,rl:0,rlMax:1,v:0},
    q:{x:Math.cos(a)*d,y:Math.sin(a)*d,h:enemyFirst?a+Math.PI+rnd(-.6,.6):rnd(0,6.28),rl:enemyFirst?.6:2.6,v:0}};
  if(e.nat&&e.kind!=='hunter')adjRel(e.nat,-4);
  const my=ship();
  sheet(`<p class="eyebrow">Engagement · wind from the ${windFrom()}</p><h2 style="font-size:22px">Your ${my.n.toLowerCase()} vs. the ${e.label}</h2>
  <canvas class="arena" id="bc"></canvas>
  <div class="bstats"><div><h4>YOU · ${S.guns} GUNS</h4><div class="meterline"><span>Hull</span><span id="ph"></span></div><div class="gauge h"><i id="phg"></i></div><div class="meterline"><span>Crew</span><span id="pc"></span></div></div>
  <div><h4>THEM · ${e.guns} GUNS</h4><div class="meterline"><span>Hull</span><span id="qh"></span></div><div class="gauge h"><i id="qhg"></i></div><div class="meterline"><span>Crew</span><span id="qc"></span></div></div></div>
  <div class="bmsg" id="bmsg"></div>
  <div class="bctl"><button type="button" id="bl" aria-label="Steer to port">◀</button><button type="button" id="bf" class="fire">FIRE<i id="brl"></i></button><button type="button" id="br" aria-label="Steer to starboard">▶</button></div>
  <p class="note" style="margin-top:8px">Your guns fire out of both sides. Turn until she lies off your beam and the guide line turns green, then fire. Ram her to board. Sail out of sight to escape.</p>`);
  holdBtn($('#bl'),()=>{if(B)B.steer=-1;},()=>{if(B&&B.steer<0)B.steer=0;});
  holdBtn($('#br'),()=>{if(B)B.steer=1;},()=>{if(B&&B.steer>0)B.steer=0;});
  $('#bf').addEventListener('pointerdown',ev=>{ev.preventDefault();battleFire();});
}
function volley(sh,guns,mine,sides,L){
  const n=Math.ceil(guns/2);
  for(const sd of sides){const ang=sh.h+sd*Math.PI/2;
    for(let i=0;i<n;i++){const off=(n>1?i/(n-1)-.5:0)*L*.7,a=ang+rnd(-.07,.07),sp=270;
      const bx=sh.x+Math.cos(sh.h)*off+Math.cos(ang)*L*.2,by=sh.y+Math.sin(sh.h)*off+Math.sin(ang)*L*.2;
      B.balls.push({x:bx,y:by,vx:Math.cos(a)*sp+Math.cos(sh.h)*sh.v,vy:Math.sin(a)*sp+Math.sin(sh.h)*sh.v,life:1.1+rnd(-.12,.12),mine});
      B.fx.push({x:bx,y:by,r:5,life:.7,t:'smoke'});}}
  sfx(mine?'cannon':'cannonFar');
}
function battleFire(){
  if(!B||B.over)return;const P=B.p;
  if(P.rl>0){B.msg='The guns are still reloading!';B.msgT=1;return;}
  volley(P,S.guns,true,[-1,1],ship().len);P.rlMax=P.rl=reloadTime(S.guns,S.crew,true);B.msg='Fire!';B.msgT=.8;
}
function hitShip(b,s,L){const dx=b.x-s.x,dy=b.y-s.y,c=Math.cos(-s.h),sn=Math.sin(-s.h),lx=dx*c-dy*sn,ly=dx*sn+dy*c;return (lx/(L/2))**2+(ly/(L*.19))**2<1;}
function updBattle(dt){
  const P=B.p,Q=B.q,e=B.e,my=ship(),es=SHIPS[e.ship];
  B.t+=dt;B.msgT-=dt;
  if(!B.over)P.h=wrapA(P.h+B.steer*my.turn*(S.skill==='nav'?1.15:1)*.9*dt);
  P.v=B.over?P.v*.97:72*windF(P.h)*my.spd*(S.skill==='nav'?1.1:1)*(.45+.55*S.hull/my.hull);
  P.x+=Math.cos(P.h)*P.v*dt;P.y+=Math.sin(P.h)*P.v*dt;
  const dx=P.x-Q.x,dy=P.y-Q.y,dist=Math.hypot(dx,dy),brg=Math.atan2(dy,dx),hf=e.hull/e.maxHull;
  const fleeing=e.kind==='merchant'||(hf<.2&&e.kind!=='hunter');
  let want;
  if(fleeing){const away=brg+Math.PI;let bs=-1;want=away;for(const a of[-1.2,-.6,0,.6,1.2]){const h=away+a,sc=windF(h)*Math.cos(a*.8);if(sc>bs){bs=sc;want=h;}}}
  else if(e.kind==='pirate'&&e.crew>=S.crew*.8)want=brg;
  else{const side=wrapA(Q.h-brg)>0?1:-1;want=dist>330?brg+side*.35:dist<120?brg+side*2.1:brg+side*Math.PI/2;}
  if(!B.over&&e.hull>0)Q.h=wrapA(Q.h+clamp(wrapA(want-Q.h),-es.turn*.85*dt,es.turn*.85*dt));

function daughterHTML(p){
  const d=S.dau[p.id];if(!d)return '';

    let g='';

      if(S.pieces<4){S.pieces++;g='She presses a scrap of an old treasure map into your hand. "I found it among Father\'s papers."';if(S.pieces>=4)completeMap();}
      else{const gold=ri(300,800);S.gold+=gold;g=`She has saved ${fmt(gold)} pieces of eight from the household for your voyages.`;}
      log(`Home to ${d.name} at ${p.n}.`);}
    let news='';
    if(!S.expect&&S.kids.length<8&&(!S.kids.length||S.day-S.kids[S.kids.length-1].born>=300)&&S.day-S.lastNews>=45&&Math.random()<.5){S.expect=S.day+ri(250,280);S.lastNews=S.day;news=` She takes your hands and whispers that you are to be a father${S.kids.length?' again':''}.`;log(`${d.name} is with child.`);sfx('step');}
    else if(S.expect)news=` She is expecting your ${S.kids.length?'next ':''}child.`;

    return `<h3>Your wife</h3><p>${d.name} runs to meet you at the door of the governor's house.${kids}${news} ${g}</p>${S.kids.some(k=>!k.bapt)?'<p class="note">A child of yours awaits Baptism. Visit the Church tab.</p>':''}`;}
  if(d.scorn)return `<h3>${nm}</h3><p>${d.name} will not see the man who sacked her father's town.</p>`;
  if(S.rel[p.nat]<10)return '';
  if(!d.met){
    if(S.rank[p.nat]<1)return `<p class="note">The governor mentions a daughter, but she does not receive common sea captains. Earn a rank with ${NAT[p.nat].n} first.</p>`;
    d.met=true;log(`Introduced to ${nm}, daughter of the governor of ${p.n}.`);
    return `<h3>The governor's daughter</h3><p>The governor introduces his daughter, ${nm}. She is ${BEAUTY[d.beauty]}.</p>${danceBtn(d)}`;}
  const feel=d.aff<3?'polite but reserved':d.aff<6?'clearly fond of you':d.aff<9?'quite smitten':'deeply in love with you';
  let prop='';
  if(S.engaged===p.id)return `<h3>${nm}</h3><p>Your betrothed. The banns have been read, and she waits for you at ${churchName(p)}.</p><div class="row"><button class="btn red" data-a="tab" data-v="church">Go to the church</button></div>`;
  if(d.aff>=9&&!S.wife&&!S.engaged)prop=S.rank[p.nat]>=3&&S.rel[p.nat]>=30?`<div class="row"><button class="btn red" data-a="propose">Ask for her hand</button></div>`:`<p class="note">She would say yes, but her father will only give her hand to a Colonel or better of ${NAT[p.nat].n}.</p>`;
  return `<h3>${nm}</h3><p>She is ${BEAUTY[d.beauty]}, and ${feel}.${S.wife?' But you are a married man now.':''}</p>${prop}${S.wife?'':danceBtn(d)}`;
}
function danceBtn(d){const ok=S.day-d.danced>=20;return `<div class="row"><button class="btn" data-a="dance" ${ok?'':'disabled'}>Ask her to dance</button></div>${ok?'':'<p class="note">You danced with her only recently. Call again after your next voyage.</p>'}`;}

function rumor(p){
  const opts=[];
  const best=PORTS.filter(q=>q!==p).sort((a,b)=>S.ps[b.id].price-S.ps[a.id].price)[0];
  opts.push(`Merchants in ${best.n} are paying ${S.ps[best.id].price} a ton for goods this month.`);
  const wars=Object.keys(S.wars).filter(k=>S.wars[k]).map(k=>k.split('-').map(n=>NAT[n].n).join(' and '));
  opts.push(`They say ${pick(wars)} are at war. Rich pickings for a captain with the right letter of marque.`);
  if(S.fame>20)opts.push('A man in a fine coat was asking about you by name. A pirate hunter, they say.');
  if(S.pieces>0&&S.pieces<4)opts.push('Old salts swear the rest of that map you carry is scattered among the taverns of the Main.');
  const ds=Object.entries(S.dau).filter(([id,d])=>!d.met&&id!==p.id);
  if(ds.length){const[id,d]=pick(ds);opts.push(`The governor of ${PORT[id].n} has a daughter, ${d.name}. They say she is ${BEAUTY[d.beauty]}.`);}
  opts.push(`The wind blows from the ${windFrom()} this month. Sailing into it, you'll hardly make headway.`);
  if(S.morale<30)opts.push('Your own crew are muttering over their cups. They want their share of the plunder.');
  return pick(opts);
}

  S.gold-=net;S.ship=k;S.hull=s.hull;S.guns=Math.min(s.guns,Math.max(S.guns,Math.round(s.guns*.6)));S.crew=Math.min(S.crew,s.crew);S.cargo=Math.min(S.cargo,s.cargo);
  log(`Bought a ${s.n.toLowerCase()} in ${curPort.n}.`);renderPort();};
A.divide=()=>{const share=Math.round(S.gold*.4);S.personal+=share;S.gold=0;S.crew=Math.max(8,Math.round(S.crew*.3));S.morale=95;sfx('coin');
  log(`Divided the plunder at ${curPort.n}. Captain's share: ${fmt(share)}.`);renderPort();toast(`Your share: ${fmt(share)} pieces of eight.`);};
A.mass=()=>{S.lastMass=S.day;S.morale=clamp(S.morale+8,0,100);sfx('bell');toast('Your crew leave Mass in better spirits.');renderPort();};
A.confess=()=>{S.lastConf=S.day;S.morale=clamp(S.morale+3,0,100);sfx('step');toast('You receive absolution and leave lighter of heart.');renderPort();};
A.anoint=()=>{S.lastAnoint=S.day;S.morale=clamp(S.morale+5,0,100);sfx('bell');log(`Received the Anointing of the Sick at ${churchName(curPort)}.`);toast('The priest anoints you and prays for your strength.');renderPort();};
A.alms=v=>{v=+v;if(S.gold<v)return;S.gold-=v;S.fame+=v>=500?2:0;adjRel(curPort.nat,v>=500?4:1);sfx('coin');toast(`The poor of ${curPort.n} bless your name.`);renderPort();};
A.bapt=i=>{const k=S.kids[+i];k.bapt=true;S.fame+=1;sfx('bell');log(`${k.name} baptized at ${churchName(curPort)}, with the governor standing as godfather.`);toast(`${k.name} is baptized. The governor stands as godfather.`);renderPort();};
A.conf=i=>{const k=S.kids[+i];k.conf=true;sfx('bell');log(`${k.name} confirmed at ${churchName(curPort)}.`);toast(`${k.name} receives the sacrament of Confirmation.`);renderPort();};
A.orders=i=>{const k=S.kids[+i];k.priest=true;S.fame+=3;sfx('bell');log(`Our son ${k.name} is ordained a priest.`);toast(`${k.name} is ordained a priest. Your wife weeps for joy.`);renderPort();};
A.mid=i=>{const k=S.kids[+i];k.mid=true;S.morale=clamp(S.morale+5,0,100);sfx('win');log(`Our son ${k.name} joins the ship as midshipman.`);toast(`${k.name} signs aboard as your midshipman. He fences well.`);renderPort();};
A.kwed=i=>{const k=S.kids[+i];if(S.gold<500)return;S.gold-=500;k.wed=true;S.fame+=1;sfx('bell');log(`Gave our daughter ${k.name} away in marriage.`);toast(`${k.name} is married. You give her away with a proud heart.`);renderPort();};
A.retire_ask=()=>{sheet(`<p class="eyebrow">Retire</p><h2>Leave the sea for good?</h2><p>Your career ends here, and your fortune, titles, family and fame decide how you live out your days.</p>
  <div class="row"><button class="btn red" data-a="retire">Retire</button><button class="btn pri" data-a="tab" data-v="plunder">Not yet</button></div>`);};
A.retire=()=>retire();
A.raid=()=>{const p=curPort,g=garrison(p)+ri(-10,30),wasFriendly=S.rel[p.nat]>-25;
  const lostC=Math.round(S.crew*rnd(.06,.16)),lostH=ri(5,18);S.crew=Math.max(6,S.crew-lostC);S.hull=Math.max(5,S.hull-lostH);
  toast(`The fort's guns rake your boats. ${lostC} men lost.`);
  startDuel({foe:`the commander of ${p.n}`,skill:.8,mine:S.crew,theirs:g,cb:win=>{
    adjRel(p.nat,wasFriendly?-75:-30);
    if(wasFriendly){S.rank[p.nat]=0;S.deeds[p.nat]=0;log(`${NAT[p.nat].n} brands you an outlaw and strips you of your titles.`);}
    const d=S.dau[p.id],home=S.wife&&S.wife.pid===p.id;
    if(d&&!home){d.scorn=true;d.aff=0;}
    if(home){S.fame=Math.max(0,S.fame-5);log(`${S.wife.name} is mortified that you attacked her own town.`);}
    sfx(win?'win':'lose');if(win){const loot=p.size*ri(800,1500);S.gold+=loot;S.fame+=8;S.raids++;S.ps[p.id].raid=month();S.crew=Math.max(8,S.crew-ri(3,12));
      NK.forEach(n=>{if(atWar(n,p.nat)){S.deeds[n]+=3;adjRel(n,6);}});
      log(`Sacked ${p.n} and carried off ${fmt(loot)} pieces of eight.`);
      result(`${p.n} has fallen`,`The commander surrenders his sword. Your men strip the treasury and the merchants' strongboxes: <b>${fmt(loot)}</b> pieces of eight.${wasFriendly?` ${NAT[p.nat].n} will not forget this.`:''}`);}
    else{const lost=Math.round(S.crew*.45);S.crew=Math.max(6,S.crew-lost);S.morale=clamp(S.morale-20,0,100);
      log(`Repulsed at ${p.n}. Lost ${lost} men.`);result('Beaten back',`The garrison holds. You fall back to the boats with ${lost} more men lost.`);}
  }});};
function dig(){
  sfx('win');const g=ri(3500,7000);S.gold+=g;S.fame+=6;log(`Dug up a buried treasure on ${S.treasure.n}: ${fmt(g)} pieces of eight!`);
  const where=S.treasure.n;S.treasure=null;S.pieces=0;
  sheet(`<p class="eyebrow">Treasure</p><h2>X marks the spot</h2><p>On ${where}, your shovels strike the lid of an iron-bound chest. Inside lies <b>${fmt(g)}</b> pieces of eight in old Spanish coin.</p><div class="row"><button class="btn pri" data-a="close">Back to the chart</button></div>`);
}

/* ---------- retire / title ---------- */
function retire(){
  const ranks=NK.reduce((a,n)=>a+S.rank[n],0),bestN=NK.slice().sort((a,b)=>S.rank[b]-S.rank[a])[0];
  const wifeD=S.wife&&S.dau[S.wife.pid];
  const score=Math.round(S.personal+S.gold*.25+S.fame*120+ranks*700+(wifeD?(wifeD.beauty+1)*2000:0)+S.kids.length*900);
  const end=score<3000?'You end your days mending nets in a fishing village. The children laugh at your stories of galleons and gold.':
    score<9000?'You buy a tavern near the docks, where the drinks are watered and your tales grow taller every year.':
    score<20000?'You settle on a modest plantation and become a respected figure in the colony.':
    score<40000?`${NAT[bestN].n} names you governor of a colony. You hang pirates now, with a twinkle in your eye.`:
    'Your fortune and titles are the envy of the courts of Europe. Ballads of your exploits are sung for a hundred years.';
  const pr=S.kids.filter(k=>k.priest);
  const fam=wifeD?` ${S.wife.name} is at your side${S.kids.length?`, and ${S.kids.length} children fill your table on Sundays${pr.length?`, while ${pr[0].name} says the Mass`:''}. Your grandchildren grow up on tales of the Spanish Main.`:'.'}`:' You never married, and the house is quiet in the evenings.';
  wipe();
  sheet(`<p class="eyebrow">The end of a career · ${dateStr()}</p><h2>${S.name} retires at ${age()}</h2>
  <p>${end}${fam}</p>
  <dl class="stats"><dt>Fortune</dt><dd>${fmt(S.personal+S.gold*.25)} pieces of eight</dd><dt>Fame</dt><dd>${S.fame} · ${fameTitle()}</dd>
  <dt>Titles</dt><dd>${NK.filter(n=>S.rank[n]>0).map(n=>`${RANKS[S.rank[n]]} of ${NAT[n].n}`).join(', ')||'none'}</dd>
  <dt>Family</dt><dd>${wifeD?`Married to ${S.wife.name} of ${PORT[S.wife.pid].n}${S.kids.length?`, ${S.kids.length} children`:''}`:'Unmarried'}</dd>
  <dt>Record</dt><dd>${S.wins} victories, ${S.prizes} prizes, ${S.raids} towns sacked</dd><dt>Score</dt><dd>${fmt(score)}</dd></dl>
  <div class="row"><button class="btn pri" data-a="title">A new career</button></div>`);
  S=null;
}
let pickN='en',pickS='fence',pickD=1;
A.title=()=>titleScreen();
function titleScreen(){
  const saved=load();
  sheet(`<p class="eyebrow">The Caribbean · 1660</p><div class="title-art">Brethren of the Coast</div>
  <p class="sub">Sail the Spanish Main as a privateer. Take prizes, cross swords, sack towns, court a governor's daughter, and retire rich — if you live that long.</p>
  ${saved?`<div class="row"><button class="btn pri" data-a="cont">Continue: ${saved.name}, ${MONTHS[Math.floor(saved.day/30)%12]} ${1660+Math.floor(saved.day/360)}</button></div><h3>Or begin anew</h3>`:''}
  <label class="lbl" for="nm">YOUR NAME</label><input class="txt" id="nm" maxlength="24" value="Captain Hawkes" autocomplete="off">
  <label class="lbl">SAIL UNDER THE FLAG OF</label><div class="pick">${NK.map(n=>`<button type="button" data-a="pn" data-v="${n}" aria-pressed="${pickN===n}"><span class="flag" style="background:${NAT[n].c}"></span>${NAT[n].n}<small>Start at ${PORT[{es:'havana',en:'portroyal',fr:'tortuga',nl:'willemstad'}[n]].n}${n==='es'?' · at war with everyone':''}</small></button>`).join('')}</div>
  <label class="lbl">YOUR SPECIAL SKILL</label><div class="pick">${Object.entries(SKILLS).map(([k,s])=>`<button type="button" data-a="ps" data-v="${k}" aria-pressed="${pickS===k}">${s.n}<small>${s.d}</small></button>`).join('')}</div>
  <label class="lbl">DIFFICULTY</label><div class="pick">${DIFF.map((d,i)=>`<button type="button" data-a="pd" data-v="${i}" aria-pressed="${pickD===i}">${d.n}</button>`).join('')}</div>
  <div class="row"><button class="btn pri" data-a="start" style="min-height:52px;font-size:17px">Weigh anchor</button></div>`);
}
const keepName=()=>{const el=$('#nm');return el?el.value:''};
A.pn=v=>{const n=keepName();pickN=v;titleScreen();$('#nm').value=n;};
A.ps=v=>{const n=keepName();pickS=v;titleScreen();$('#nm').value=n;};
A.pd=v=>{const n=keepName();pickD=+v;titleScreen();$('#nm').value=n;};
A.start=()=>{const n=(keepName()||'').trim()||'Captain Hawkes';newGame(n,pickN,pickS,pickD);begin();
  sheet(`<p class="eyebrow">${dateStr()}</p><h2>Your orders</h2><p>${NAT[S.nat].n} has granted you a letter of marque. You command a sloop of 8 guns and 40 men, with 600 pieces of eight in the ship's purse.</p>
  <p>Hold <b>◀</b> and <b>▶</b> to steer. Your ship always runs before the wind, which now blows from the <b>${windFrom()}</b>. Sail with it or across it and you fly; turn into it and you'll hardly move. Sail into a harbor to enter port.</p>
  <p>Take prizes from your nation's enemies, then visit a governor to be rewarded. Win a rank and you may be introduced to a governor's daughter. When the crew grows restless, divide the plunder.</p>
  <div class="row"><button class="btn pri" data-a="close">To sea!</button></div>`);};
A.cont=()=>{S=load();if(!S)return titleScreen();begin();closeSheet();};
function begin(){resize();centerOn(S.x,S.y);view.follow=true;hud();}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S){if(!paused)update(dt);if(view.follow)centerOn(S.x,S.y);draw();hud();}
  else{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#1d4aa8';ctx.fillRect(0,0,W,H);}
  if(B){updBattle(dt);drawBattle();}
  if(D)updDuel(dt);
  if(DN)updDance(dt);
  musicTick();waterTick();
  requestAnimationFrame(loop);}
const sndBtn=$('#snd');const sndLabel=()=>sndBtn.textContent=SMODES[SND.mode];sndLabel();
sndBtn.addEventListener('click',()=>{SND.mode=(SND.mode+1)%3;try{localStorage.setItem('brethren-sound',SND.mode)}catch(_){}sndLabel();sfx('blip');});
resize();titleScreen();requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
})();
</script>

</body></html>
