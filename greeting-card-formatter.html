<style>
:root{
  /* Layout: a chart table — HUD strip, full-bleed sea chart, command bar; parchment orders slide up over the chart */

html,body{height:100%}

#map{position:absolute;inset:0;width:100%;height:100%;display:block}

.bar button{flex:1}

.scene{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid var(--ink);border-radius:2px;margin:8px 0 10px;background:#000}

.chart{display:block;width:100%;height:auto;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.25);margin:6px 0}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}

.fgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px 8px;align-items:center}
.fgrid span{font-family:var(--f-label);font-size:12px;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
.fgrid button{font-family:var(--f-label);font-size:16px;min-height:56px;border:0;border-radius:4px;background:var(--ink);color:var(--parch);touch-action:none;user-select:none;-webkit-user-select:none}

function load(){try{const t=localStorage.getItem(SAVE);return t?JSON.parse(t):null}catch(e){return null}}
function wipe(){try{localStorage.removeItem(SAVE)}catch(e){}}
function log(t){S.log.unshift({d:dateStr(),t});S.log.length=Math.min(S.log.length,60)}
function adjRel(n,d){S.rel[n]=clamp(S.rel[n]+d,-100,100)}
const awayHeading=p=>Math.atan2(p.y-p.ty,p.x-p.tx);

function newGame(name,nat,skill,diff){
  const home={es:'havana',en:'portroyal',fr:'tortuga',nl:'willemstad'}[nat], p=PORT[home];
  S={name,nat,skill,diff,ship:'sloop',guns:8,hull:60,crew:40,rations:40*45,cargo:0,gold:600,personal:0,morale:80,fame:0,day:0,
     x:p.x,y:p.y,heading:awayHeading(p),anchored:false,speed:0,lastPort:home,wind:Math.PI,calm:2,
     rel:{es:-10,en:0,fr:0,nl:0},deeds:{es:0,en:0,fr:0,nl:0},rank:{es:0,en:0,fr:0,nl:0},
     wars:{'en-es':true,'es-fr':true,'es-nl':true,'en-nl':true,'en-fr':false,'fr-nl':false},
     pieces:0,treasure:null,log:[],ps:{},dau:{},wife:null,wifeGift:-999,kids:[],expect:null,engaged:null,lastMass:-99,lastConf:-99,lastAnoint:-999,lastNews:-999,wins:0,prizes:0,raids:0,acc:0,seen:{[home]:1},tre:ri(0,CAYS.length-1),fixDay:0,drift:rnd(0,6.28),fix:null};
  if(nat==='es'){S.rel.en=-10;S.rel.fr=-10;S.rel.nl=-10;}
  S.rel[nat]=40; S.rank[nat]=1;
  for(const q of PORTS)if(q.size>=2&&Math.random()<.85)S.dau[q.id]={name:pick(DNAMES[q.nat]),beauty:clamp(ri(0,2)+(q.size===3?1:0),0,3),aff:0,met:false,scorn:false,danced:-99};
  refreshPorts();
  FOG=new Uint8Array(FW*FH);reveal(S.x,S.y,500);
  log(`${name} receives a letter of marque from ${NAT[nat].n} and takes command of a sloop at ${p.n}.`);
  save();
}
function refreshPorts(){
  for(const p of PORTS){const o=S.ps[p.id]||(S.ps[p.id]={raid:-99});
    o.rec=p.size*12+ri(0,18); o.price=ri(18,52); o.food=+rnd(.06,.11).toFixed(3);
    o.piece=S.pieces<4&&Math.random()<.28; o.pieceCost=ri(200,480);}
}

/* ---------- wind ---------- */
function windF(h){const d=Math.acos(clamp(Math.cos(h-S.wind),-1,1));
  if(d<Math.PI/2)return .8+.2*Math.sin(d);const t=(d-Math.PI/2)/(Math.PI/2);return Math.max(.04,1-.96*Math.pow(t,1.25));}
function windFrom(){const a=wrapA(S.wind+Math.PI);const dirs=['east','southeast','south','southwest','west','northwest','north','northeast'];return dirs[((Math.round(a/(Math.PI/4))%8)+8)%8];}

/* ---------- map ---------- */
const cv=$('#map'), ctx=cv.getContext('2d'), wrap=$('#wrap');
let W=0,H=0,dpr=1; const view={s:1,cx:0,cy:0,follow:true};
function resize(){const r=wrap.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;view.s=Math.max(1.15,W/WW,H/WH);clampView();}
function clampView(){view.cx=clamp(view.cx,0,Math.max(0,WW-W/view.s));view.cy=clamp(view.cy,0,Math.max(0,WH-H/view.s));}
function centerOn(x,y){view.cx=x-W/view.s/2;view.cy=y-H/view.s/2;clampView();}
window.addEventListener('resize',resize);

const TOWN=['.......c......','......ccc.....','.......c...f..','......www..|..','......wbw..|..','.rr...www..|r.','rrrr.rwwwrrrrr','wwdw.wwdwwwdww','s.s.s.s.s.s.s.','ssssssssssssss'];
function sprite(c,art,x,y,u,pal){const h=art.length,w=art[0].length;
  for(let r=0;r<h;r++)for(let col=0;col<w;col++){const ch=art[r][col];if(ch==='.')continue;c.fillStyle=pal[ch];c.fillRect(x+(col-w/2)*u,y+(r-h)*u,u+.4,u+.4);}}
function draw(){
  const s=view.s,k=1/s,T=performance.now()/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#1d4aa8';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-view.cx*s,-view.cy*s);ctx.scale(s,s);
  ctx.drawImage(world,0,0,WW,WH);
  const x0=view.cx/PX-3,x1=(view.cx+W*k)/PX+3,y0=view.cy/PX-3,y1=(view.cy+H*k)/PX+3;
  ctx.fillStyle='#8cc4ff';
  for(const w of WAVES){if(w.x<x0||w.x>x1||w.y<y0||w.y>y1)continue;if(Math.sin(T*1.6+w.ph)<.5)continue;
    const off=Math.floor((T*.8+w.ph)%3);ctx.fillRect((w.x+off)*PX,w.y*PX,w.len*PX,PX);}
  const pal={r:'#c4452f',w:'#f1e7cf',d:'#6b4423',b:'#3a2a20',c:'#f0c93c',s:'#9a948a','|':'#4a3a2a'};
  for(const p of PORTS){
    pal.f=NAT[p.nat].c;sprite(ctx,TOWN,p.tx,p.ty+20,4,pal);
    if(!S.seen[p.id])continue;
    if(hostile(p)||p.haven){ctx.beginPath();ctx.arc(p.tx,p.ty,22*k+22,0,7);ctx.lineWidth=2*k;ctx.strokeStyle=p.haven?'#ffffff':'#ff5a3c';ctx.setLineDash([3*k,3*k]);ctx.stroke();ctx.setLineDash([]);}
    const raided=S.ps[p.id].raid>month()-12;
    ctx.font=`600 ${12*k}px "Pixelify Sans",monospace`;ctx.textAlign='center';const label=p.n.toUpperCase()+(S.wife&&S.wife.pid===p.id?' ♥':''),tw=ctx.measureText(label).width;
    const ly=p.ty-26-4*k;
    ctx.fillStyle='rgba(10,20,40,.7)';ctx.fillRect(p.tx-tw/2-3*k,ly-11*k,tw+6*k,14*k);
    ctx.fillStyle=raided?'#b8b0a0':'#ffffff';ctx.fillText(label,p.tx,ly);
  }
  if(S.speed>4&&!paused){ctx.fillStyle='rgba(255,255,255,.8)';const cx=Math.cos(S.heading),cy=Math.sin(S.heading);
    for(let i=1;i<=5;i++){if(Math.sin(T*8-i)>-.3){const d=16+i*8,w=2+i*.9;ctx.fillRect(Math.round(S.x-cx*d-cy*w-2),Math.round(S.y-cy*d+cx*w-2),4,4);ctx.fillRect(Math.round(S.x-cx*d+cy*w-2),Math.round(S.y-cy*d-cx*w-2),4,4);}}}
  ctx.drawImage(shipSprite(S.ship,dirOf(S.heading),NAT[S.nat].c),Math.round(S.x-24),Math.round(S.y-24),48,48);
  ctx.restore();
  drawWind(ctx,34,H-38);
}
function drawWind(c,wx,wy){
  c.save();c.translate(wx,wy);
  c.fillStyle='rgba(10,20,40,.65)';c.beginPath();c.arc(0,0,24,0,7);c.fill();
  c.strokeStyle='#d3a64f';c.lineWidth=1;c.beginPath();c.arc(0,0,24,0,7);c.stroke();
  c.rotate(S.wind);c.fillStyle='#ffffff';c.beginPath();c.moveTo(15,0);c.lineTo(-10,-6);c.lineTo(-5,0);c.lineTo(-10,6);c.fill();
  c.restore();c.fillStyle='#ffffff';c.font='600 11px "Pixelify Sans",monospace';c.textAlign='center';c.fillText('WIND',wx,wy-29);c.textAlign='left';
}

/* ---------- input ---------- */
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy,drag:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(!pd.drag&&Math.hypot(dx,dy)>8){pd.drag=true;view.follow=false;}
  if(pd.drag){view.cx=pd.cx-dx/view.s;view.cy=pd.cy-dy/view.s;clampView();}});
cv.addEventListener('pointerup',()=>{if(!pd)return;const wasDrag=pd.drag;pd=null;if(!wasDrag)view.follow=true;});
cv.addEventListener('pointercancel',()=>pd=null);
function holdBtn(el,on,off){
  el.addEventListener('pointerdown',ev=>{ev.preventDefault();try{el.setPointerCapture(ev.pointerId)}catch(_){}el.classList.add('on');on();});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>{el.classList.remove('on');off();}));
  el.addEventListener('contextmenu',ev=>ev.preventDefault());
}
holdBtn($('#b-left'),()=>{steer=-1;$('#taphint').hidden=true;},()=>{if(steer<0)steer=0;});
holdBtn($('#b-right'),()=>{steer=1;$('#taphint').hidden=true;},()=>{if(steer>0)steer=0;});
const keys={};
window.addEventListener('keydown',e=>{
  if(D&&!D.over){const k=e.key.toLowerCase(),am={q:0,w:1,e:2},pm={a:0,s:1,d:2};
    if(k in am){duelAttack(am[k]);e.preventDefault();return;}if(k in pm){duelGuard(pm[k]);e.preventDefault();return;}
    if(e.key==='ArrowUp'){duelGuard(D.me.g-1);e.preventDefault();return;}if(e.key==='ArrowDown'){duelGuard(D.me.g+1);e.preventDefault();return;}
    if(e.key===' '||e.key==='ArrowRight'){duelAttack(D.me.g);e.preventDefault();return;}}
  if(e.key==='ArrowLeft'||e.key==='a'){keys.l=1;e.preventDefault();}
  if(e.key==='ArrowRight'||e.key==='d'){keys.r=1;e.preventDefault();}
  if(e.key===' '&&B&&!B.over){e.preventDefault();battleFire();}
  if((e.key==='Escape'||e.key==='m')&&S&&$('#veil').hidden){menu();}
  syncKeys();});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;if(e.key==='ArrowRight'||e.key==='d')keys.r=0;syncKeys();});
function syncKeys(){const v=(keys.r?1:0)-(keys.l?1:0);if(B)B.steer=v;else steer=v;}

/* ---------- sailing ---------- */
function update(dt){
  S.heading=wrapA(S.heading+steer*ship().turn*(S.skill==='nav'?1.1:1)*.85*dt);reveal(S.x,S.y,420);
  if(S.lastPort){const lp=PORT[S.lastPort];if(Math.hypot(lp.x-S.x,lp.y-S.y)>110)S.lastPort=null;}
  if(S.anchored){S.speed=0;return;}
  const sp=100*windF(S.heading)*ship().spd*(S.skill==='nav'?1.12:1)*(.55+.45*S.hull/ship().hull);
  const nx=S.x+Math.cos(S.heading)*sp*dt,ny=S.y+Math.sin(S.heading)*sp*dt;
  if(onLand(nx,ny)){S.speed=0;if(!S.aground){S.aground=true;sfx('thud');toast('Breakers ahead! Steer away from the coast.');}return;}
  S.aground=false;S.speed=sp;S.x=nx;S.y=ny;
  for(const p of PORTS){if(p.id!==S.lastPort&&Math.hypot(p.x-S.x,p.y-S.y)<40){openPort(p);return;}}
  if(S.pieces>=4){const tc=CAYS[S.tre];if(Math.hypot(tc.x-S.x,tc.y-S.y)<75){dig();return;}}
  S.acc+=sp*dt/(24*WS);
  while(S.acc>=1&&!paused){S.acc-=1;newDay();}
}
function newDay(){
  S.day++;
  S.rations-=S.crew;
  if(S.rations<0){S.rations=0;S.morale=clamp(S.morale-2,0,100);const lost=Math.max(1,Math.floor(S.crew*.02));S.crew=Math.max(6,S.crew-lost);if(S.day%5===0)toast('The stores are empty. Men are going hungry.');}
  if(S.day%30===0)newMonth();
  if(S.calm>0){S.calm--;return;}
  if(!paused&&Math.random()<.036+S.fame*.0002)encounter();
}
function newMonth(){
  S.wind=Math.PI+rnd(-.7,.7);
  S.morale=clamp(S.morale-(S.skill==='wit'?1:2)+(S.gold/Math.max(1,S.crew)>40?2:0)-(S.gold/Math.max(1,S.crew)<4?2:0),0,100);
  refreshPorts();
  if(S.expect&&S.day>=S.expect)birth();
  if(month()%12===0){
    const k=pick(['en-fr','fr-nl','en-nl']);S.wars[k]=!S.wars[k];
    const[a,b]=k.split('-');const news=S.wars[k]?`War! ${NAT[a].n} and ${NAT[b].n} have declared war on one another.`:`${NAT[a].n} and ${NAT[b].n} have signed a peace.`;
    log(`New year's news: ${news}`);toast(news);
  }
  if(S.morale<=8&&S.crew>10){const lost=Math.floor(S.crew*.35);S.crew-=lost;S.morale=35;log(`Mutiny! ${lost} men seized a longboat and deserted.`);toast(`Mutiny! ${lost} men have deserted.`);}
  else if(S.morale<25&&Math.random()<.5)toast('The crew grumbles about their share of the plunder.');
  else toast(`The wind backs round. It now blows from the ${windFrom()}.`);
  if(age()>=60&&!S.oldWarn){S.oldWarn=true;toast('Your old bones ache. Perhaps it is time to retire.');}
  save();
}

/* ---------- HUD ---------- */
let hudCache='';
function hud(){
  if(!S)return;
  const food=Math.floor(S.rations/Math.max(1,S.crew)), hp=Math.round(S.hull/ship().hull*100);
  const kn=S.anchored?0:Math.round(S.speed/9),wf=windF(S.heading),ww=S.anchored?'sails furled':wf>.75?'fair wind':wf>.4?'beating':'in irons';
  const h=`<div class="date"><span>${dateStr()}</span><small>${S.name.toUpperCase()} · AGE ${age()} · ${ship().n.toUpperCase()}</small></div>
  <span class="chip">GOLD<b>${fmt(S.gold)}</b></span><span class="chip">CREW<b>${S.crew}</b></span>
  <span class="chip ${food<10?'warn':''}">FOOD<b>${food}d</b></span><span class="chip ${hp<40?'warn':''}">HULL<b>${hp}%</b></span>
  <span class="chip ${S.morale<30?'warn':''}">MORALE<b>${Math.round(S.morale)}</b></span><span class="chip ${!S.anchored&&wf<.4?'warn':''}">SPEED<b>${kn} kn</b> · ${ww}</span>`;
  if(h!==hudCache){$('#hud').innerHTML=h;hudCache=h;}
}
let toastT=0;
function toast(t){const el=$('#toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2800);}

/* ---------- sheets ---------- */
function sheet(html){$('#sheet').innerHTML=html;$('#veil').hidden=false;$('#sheet').scrollTop=0;paused=true;steer=0;bindScenes();}
function closeSheet(){churchOpen=false;titleOn=false;SX=null;liveScenes=[];$('#veil').hidden=true;paused=false;B=null;D=null;DN=null;E=null;view.follow=true;hud();save();}
const A={};
$('#sheet').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;sfx('blip');const f=A[b.dataset.a];if(f)f(b.dataset.v,b);});
$('#b-menu').onclick=()=>{if(S&&!paused)menu();};
A.close=()=>closeSheet();

function status(){
  const rows=NK.map(n=>`<tr><td><span class="flag" style="background:${NAT[n].c}"></span>${NAT[n].n}</td><td>${relWord(S.rel[n])}</td><td>${RANKS[S.rank[n]]}</td></tr>`).join('');
  const wars=[];['en-es','es-fr','es-nl','en-fr','en-nl','fr-nl'].forEach(k=>{if(S.wars[k]){const[a,b]=k.split('-');wars.push(`${NAT[a].n}–${NAT[b].n}`);}});
  const sweet=Object.entries(S.dau).filter(([,d])=>d.met&&!d.scorn&&d.aff>=3).map(([id,d])=>`${DTITLE[PORT[id].nat]} ${d.name} of ${PORT[id].n}`);
  sheet(`<p class="eyebrow">Captain's papers</p><h2>${S.name}</h2>
  <p class="sub">Aged ${age()}, sailing under ${NAT[S.nat].a} colors · ${fameTitle()}</p>
  <dl class="stats"><dt>Ship</dt><dd>${ship().n} — ${S.guns} guns, hull ${Math.round(S.hull)}/${ship().hull}</dd>
  <dt>Crew</dt><dd>${S.crew} of ${ship().crew} berths</dd><dt>Cargo</dt><dd>${S.cargo} of ${ship().cargo} tons</dd>
  <dt>Ship's purse</dt><dd>${fmt(S.gold)} pieces of eight</dd><dt>Your fortune</dt><dd>${fmt(S.personal)} pieces of eight</dd>
  <dt>Fame</dt><dd>${S.fame} · ${S.wins} victories, ${S.prizes} prizes, ${S.raids} towns sacked</dd>
  <dt>Map pieces</dt><dd>${S.pieces} of 4${S.pieces>=4?' — the map is whole':''}</dd>
  <dt>Heart</dt><dd>${S.wife?`Married to ${DTITLE[PORT[S.wife.pid].nat]} ${S.wife.name} of ${PORT[S.wife.pid].n}`:sweet.length?`Courting ${sweet.join(', ')}`:'Unattached'}</dd>
  ${S.kids.length?`<dt>Children</dt><dd>${S.kids.map(k=>`${k.name} (${kidAge(k)})`).join(', ')}</dd>`:''}${S.expect?'<dt>Expecting</dt><dd>A child is on the way</dd>':''}
  <dt>Skill</dt><dd>${SKILLS[S.skill].n}</dd><dt>Wind</dt><dd>From the ${windFrom()}</dd></dl>
  <h3>Standing with the crowns</h3>
  <table class="t"><thead><tr><th>Nation</th><th>Attitude</th><th>Your rank</th></tr></thead><tbody>${rows}</tbody></table>
  <p class="note" style="margin-top:10px">At war: ${wars.join(', ')||'none — an uneasy peace'}.</p>
  <div class="row"><button class="btn pri" data-a="menu">Back</button></div>`);
}
function fameTitle(){const f=S.fame;return f<5?'an unknown captain':f<20?'a captain of some repute':f<45?'a feared rover':f<80?'a famous buccaneer':'a legend of the Main';}
function showLog(){
  sheet(`<p class="eyebrow">Ship's log</p><h2>The ${ship().n}'s log</h2>
  <ul class="loglist">${S.log.map(l=>`<li><i>${l.d.toUpperCase()}</i>${l.t}</li>`).join('')}</ul>
  <div class="row"><button class="btn pri" data-a="menu">Back</button></div>`);
}

/* ---------- encounters ---------- */
function genEnemy(){
  const r=Math.random(),hp=S.fame>20?Math.min(.18,.05+S.fame*.0015):0;
  const kind=r<hp?'hunter':r<hp+.48?'merchant':r<hp+.72?'warship':'pirate';
  let nat=null;
  if(kind==='hunter'){nat=NK.slice().sort((a,b)=>S.rel[a]-S.rel[b])[0];}
  else if(kind!=='pirate'){const q=Math.random();nat=q<.4?'es':q<.6?'en':q<.8?'fr':'nl';}
  let sh;
  if(kind==='merchant')sh=Math.random()<(nat==='es'?.3:.1)?'galleon':'barque';
  else if(kind==='warship')sh=Math.random()<.55?'brig':'frigate';
  else if(kind==='pirate')sh=Math.random()<.55?'sloop':'brig';
  else sh='frigate';
  const b=SHIPS[sh],ef=DIFF[S.diff].e;
  const gm={merchant:.55,warship:1,pirate:.9,hunter:1.1}[kind], cm={merchant:.4,warship:.85,pirate:1,hunter:.9}[kind];
  const gold=kind==='merchant'?(sh==='galleon'?ri(1800,4200):ri(300,900)):kind==='pirate'?ri(300,1100):ri(150,500);
  return {kind,nat,ship:sh,guns:Math.max(4,Math.round(b.guns*gm*(.8+ef*.2))),hull:b.hull,maxHull:b.hull,crew:Math.round(b.crew*cm*ef*rnd(.85,1.1)),
    gold,cargo:kind==='merchant'?Math.round(b.cargo*rnd(.4,.85)):ri(0,15),spd:b.spd,skill:{merchant:1.05,warship:.88,pirate:.92,hunter:.78}[kind],
    label:kind==='pirate'?`pirate ${b.n.toLowerCase()}`:kind==='hunter'?`${NAT[nat].a} pirate hunter`:kind==='merchant'&&sh==='galleon'?`${NAT[nat].a} treasure galleon`:`${NAT[nat].a} ${kind==='warship'?'man-of-war ':''}${b.n.toLowerCase()}`};
}
function aggressive(e){return e.kind==='pirate'&&Math.random()<.7||e.kind==='hunter'||(e.kind==='warship'&&S.rel[e.nat]<=-25);}
function encounter(){
  const e=genEnemy();e.aggr=aggressive(e);E=e;sfx('alarm');
  const flag=e.nat?`<span class="flag" style="background:${NAT[e.nat].c}"></span>${NAT[e.nat].n}`:'The black flag';
  const warn=e.nat&&S.rel[e.nat]>=0&&!atWar(S.nat,e.nat)?`<p class="note">Attacking her will sour ${NAT[e.nat].n}'s view of you${NK.some(n=>atWar(n,e.nat))?', but her enemies will thank you':''}.</p>`:
    e.nat?`<p class="note">${NK.filter(n=>atWar(n,e.nat)).map(n=>NAT[n].n).join(' and ')||'No one'} would reward you for taking her.</p>`:'<p class="note">Every crown pays well for a pirate taken.</p>';
  const say={merchant:'Her decks ride low. She is heavy with cargo.',warship:'Her gunports are open and her decks are crowded with marines.',pirate:'She flies no honest colors.',hunter:'Her captain carries a commission to bring you in, dead or in chains.'}[e.kind];
  sheet(`<p class="eyebrow">Sail ho!</p><h2>A ${e.label}</h2>${scn('encounter',e.ship+'|'+(e.nat?NAT[e.nat].c:'#111111'))}<p>${say} ${e.aggr?'<b>She is bearing down on you.</b>':''}</p>
  <dl class="stats"><dt>Colors</dt><dd>${flag}</dd><dt>Guns</dt><dd>${e.guns}</dd><dt>Crew</dt><dd>about ${Math.max(10,Math.round(e.crew/10)*10)}</dd><dt>Your ship</dt><dd>${S.crew} men, ${S.guns} guns, hull ${Math.round(S.hull/ship().hull*100)}%</dd></dl>
  ${warn}
  <div class="row"><button class="btn pri" data-a="engage">Engage</button>
  <button class="btn" data-a="${e.aggr?'evade':'pass'}">${e.aggr?'Try to outrun her':'Let her pass'}</button></div>`);
}
A.pass=()=>{closeSheet();S.calm=2;};
A.evade=()=>{const p=clamp(.45*ship().spd/E.spd*(S.skill==='nav'?1.2:1),.12,.85);

  let gain=h>=7?3:h>=5?2:h>=3?1:0;if(gain&&S.rank[p.nat]<2)gain=Math.max(1,gain-1);if(gain&&S.fame>=30)gain++;
  d.aff+=gain;
  const words=gain>=3?'She laughs and squeezes your hand as the music ends. She cannot take her eyes off you.':gain===2?'She curtsies warmly and asks whether you will call again soon.':gain===1?'She thanks you politely. Perhaps next time.':'She limps away to sit with her aunt. That did not go well.';
  log(`Danced with ${DTITLE[p.nat]} ${d.name} at ${p.n}.`);
  setTimeout(()=>{DN=null;sheet(`<p class="eyebrow">The governor's ball · ${p.n}</p><h2>The music ends</h2>${scn('ball')}<p>${words}</p><p class="note">${h} of 8 steps in time.</p>
    <div class="row"><button class="btn pri" data-a="tab" data-v="gov">Return to the governor's house</button></div>`);},900);
}
function daughterHTML(p){
  const d=S.dau[p.id];if(!d)return '';
  const nm=`${DTITLE[p.nat]} ${d.name}`;
  if(S.wife&&S.wife.pid===p.id){
    let g='';
    if(S.day-S.wifeGift>=180){S.wifeGift=S.day;S.morale=clamp(S.morale+10,0,100);
      if(S.pieces<4){S.pieces++;g='She presses a scrap of an old treasure map into your hand. "I found it among Father\'s papers."';if(S.pieces>=4)completeMap();}
      else{const gold=ri(300,800);S.gold+=gold;g=`She has saved ${fmt(gold)} pieces of eight from the household for your voyages.`;}
      log(`Home to ${d.name} at ${p.n}.`);}
    let news='';
    if(!S.expect&&S.kids.length<8&&(!S.kids.length||S.day-S.kids[S.kids.length-1].born>=300)&&S.day-S.lastNews>=45&&Math.random()<.5){S.expect=S.day+ri(250,280);S.lastNews=S.day;news=` She takes your hands and whispers that you are to be a father${S.kids.length?' again':''}.`;log(`${d.name} is with child.`);sfx('step');}
    else if(S.expect)news=` She is expecting your ${S.kids.length?'next ':''}child.`;
    const kids=S.kids.length?` ${S.kids.map(k=>k.name).join(', ').replace(/, ([^,]*)$/,' and $1')} ${S.kids.length>1?'come running':'comes running'} behind her.`:'';
    return `<h3>Your wife</h3><p>${d.name} runs to meet you at the door of the governor's house.${kids}${news} ${g}</p>${S.kids.some(k=>!k.bapt)?'<p class="note">A child of yours awaits Baptism. Visit the Church tab.</p>':''}`;}
  if(d.scorn)return `<h3>${nm}</h3><p>${d.name} will not see the man who sacked her father's town.</p>`;
  if(S.rel[p.nat]<10)return '';
  if(!d.met){
    if(S.rank[p.nat]<1)return `<p class="note">The governor mentions a daughter, but she does not receive common sea captains. Earn a rank with ${NAT[p.nat].n} first.</p>`;
    d.met=true;log(`Introduced to ${nm}, daughter of the governor of ${p.n}.`);
    return `<h3>The governor's daughter</h3><p>The governor introduces his daughter, ${nm}. She is ${BEAUTY[d.beauty]}.</p>${danceBtn(d)}`;}
  const feel=d.aff<3?'polite but reserved':d.aff<6?'clearly fond of you':d.aff<9?'quite smitten':'deeply in love with you';
  let prop='';
  if(S.engaged===p.id)return `<h3>${nm}</h3><p>Your betrothed. The banns have been read, and she waits for you at ${churchName(p)}.</p><div class="row"><button class="btn red" data-a="tab" data-v="church">Go to the church</button></div>`;
  if(d.aff>=9&&!S.wife&&!S.engaged)prop=S.rank[p.nat]>=3&&S.rel[p.nat]>=30?`<div class="row"><button class="btn red" data-a="propose">Ask for her hand</button></div>`:`<p class="note">She would say yes, but her father will only give her hand to a Colonel or better of ${NAT[p.nat].n}.</p>`;
  return `<h3>${nm}</h3><p>She is ${BEAUTY[d.beauty]}, and ${feel}.${S.wife?' But you are a married man now.':''}</p>${prop}${S.wife?'':danceBtn(d)}`;
}
function danceBtn(d){const ok=S.day-d.danced>=20;return `<div class="row"><button class="btn" data-a="dance" ${ok?'':'disabled'}>Ask her to dance</button></div>${ok?'':'<p class="note">You danced with her only recently. Call again after your next voyage.</p>'}`;}

function birth(){const w=S.wife,nat=PORT[w.pid].nat,boy=Math.random()<.5;
  const used=S.kids.map(k=>k.name).concat([w.name]),pool=(boy?BOYS[nat]:DNAMES[nat]).filter(n=>!used.includes(n));const name=pool.length?pick(pool):pick(boy?BOYS[nat]:DNAMES[nat]);
  S.kids.push({name,boy,born:S.day,bapt:false,conf:false,called:boy&&Math.random()<.35,priest:false,mid:false,wed:false});S.expect=null;
  sfx('win');log(`A letter from ${w.name}: our ${boy?'son':'daughter'} ${name} is born at ${PORT[w.pid].n}.`);toast(`A letter from ${w.name}: a ${boy?'son':'daughter'}, ${name}, is born!`);}

function rumor(p){
  const opts=[];
  const best=PORTS.filter(q=>q!==p).sort((a,b)=>S.ps[b.id].price-S.ps[a.id].price)[0];
  opts.push(`Merchants in ${best.n} are paying ${S.ps[best.id].price} a ton for goods this month.`);
  const wars=Object.keys(S.wars).filter(k=>S.wars[k]).map(k=>k.split('-').map(n=>NAT[n].n).join(' and '));
  opts.push(`They say ${pick(wars)} are at war. Rich pickings for a captain with the right letter of marque.`);
  if(S.fame>20)opts.push('A man in a fine coat was asking about you by name. A pirate hunter, they say.');
  if(S.pieces>0&&S.pieces<4)opts.push('Old salts swear the rest of that map you carry is scattered among the taverns of the Main.');
  const ds=Object.entries(S.dau).filter(([id,d])=>!d.met&&id!==p.id);
  if(ds.length){const[id,d]=pick(ds);opts.push(`The governor of ${PORT[id].n} has a daughter, ${d.name}. They say she is ${BEAUTY[d.beauty]}.`);}
  opts.push(`The wind blows from the ${windFrom()} this month. Sailing into it, you'll hardly make headway.`);
  if(S.morale<30)opts.push('Your own crew are muttering over their cups. They want their share of the plunder.');
  return pick(opts);
}
function completeMap(){log('The four scraps of the treasure map fit together.');toast('The treasure map is whole! Study it in your charts.');}

A.buyc=()=>{const o=S.ps[curPort.id],buy=Math.round(o.price*(S.skill==='wit'?.85:1));if(S.gold<buy*10)return;S.gold-=buy*10;S.cargo+=10;renderPort();};
A.food=()=>{const o=S.ps[curPort.id],fc=Math.round(S.crew*30*o.food*(S.skill==='wit'?.85:1));if(S.gold<fc)return;S.gold-=fc;S.rations+=S.crew*30;renderPort();};
A.repair=()=>{const rc=Math.round((ship().hull-S.hull)*3*(S.skill==='wit'?.85:1));if(S.gold<rc)return;S.gold-=rc;S.hull=ship().hull;renderPort();};
A.gun=()=>{if(S.gold<110||S.guns>=ship().guns)return;S.gold-=110;S.guns++;renderPort();};
A.buyship=k=>{const tradeIn=Math.round(ship().cost*.5*S.hull/ship().hull),s=SHIPS[k],net=Math.max(0,s.cost-tradeIn);if(S.gold<net)return;
  S.gold-=net;S.ship=k;S.hull=s.hull;S.guns=Math.min(s.guns,Math.max(S.guns,Math.round(s.guns*.6)));S.crew=Math.min(S.crew,s.crew);S.cargo=Math.min(S.cargo,s.cargo);
  log(`Bought a ${s.n.toLowerCase()} in ${curPort.n}.`);renderPort();};
A.divide=()=>{const share=Math.round(S.gold*.4);S.personal+=share;S.gold=0;S.crew=Math.max(8,Math.round(S.crew*.3));S.morale=95;sfx('coin');
  log(`Divided the plunder at ${curPort.n}. Captain's share: ${fmt(share)}.`);renderPort();toast(`Your share: ${fmt(share)} pieces of eight.`);};
A.mass=()=>{S.lastMass=S.day;S.morale=clamp(S.morale+8,0,100);sfx('bell');toast('Your crew leave Mass in better spirits.');renderPort();};
A.confess=()=>{S.lastConf=S.day;S.morale=clamp(S.morale+3,0,100);sfx('step');toast('You receive absolution and leave lighter of heart.');renderPort();};
A.anoint=()=>{S.lastAnoint=S.day;S.morale=clamp(S.morale+5,0,100);sfx('bell');log(`Received the Anointing of the Sick at ${churchName(curPort)}.`);toast('The priest anoints you and prays for your strength.');renderPort();};
A.alms=v=>{v=+v;if(S.gold<v)return;S.gold-=v;S.fame+=v>=500?2:0;adjRel(curPort.nat,v>=500?4:1);sfx('coin');toast(`The poor of ${curPort.n} bless your name.`);renderPort();};
A.bapt=i=>{const k=S.kids[+i];k.bapt=true;S.fame+=1;sfx('bell');log(`${k.name} baptized at ${churchName(curPort)}, with the governor standing as godfather.`);toast(`${k.name} is baptized. The governor stands as godfather.`);renderPort();};
A.conf=i=>{const k=S.kids[+i];k.conf=true;sfx('bell');log(`${k.name} confirmed at ${churchName(curPort)}.`);toast(`${k.name} receives the sacrament of Confirmation.`);renderPort();};
A.orders=i=>{const k=S.kids[+i];k.priest=true;S.fame+=3;sfx('bell');log(`Our son ${k.name} is ordained a priest.`);toast(`${k.name} is ordained a priest. Your wife weeps for joy.`);renderPort();};
A.mid=i=>{const k=S.kids[+i];k.mid=true;S.morale=clamp(S.morale+5,0,100);sfx('win');log(`Our son ${k.name} joins the ship as midshipman.`);toast(`${k.name} signs aboard as your midshipman. He fences well.`);renderPort();};
A.kwed=i=>{const k=S.kids[+i];if(S.gold<500)return;S.gold-=500;k.wed=true;S.fame+=1;sfx('bell');log(`Gave our daughter ${k.name} away in marriage.`);toast(`${k.name} is married. You give her away with a proud heart.`);renderPort();};
A.retire_ask=()=>{sheet(`<p class="eyebrow">Retire</p><h2>Leave the sea for good?</h2><p>Your career ends here, and your fortune, titles, family and fame decide how you live out your days.</p>
  <div class="row"><button class="btn red" data-a="retire">Retire</button><button class="btn pri" data-a="tab" data-v="plunder">Not yet</button></div>`);};
A.retire=()=>retire();
A.raid=()=>startAssault(curPort);
function dig(){const c=CAYS[S.tre];
  sfx('win');const gold=ri(3500,7000);S.gold+=gold;S.fame+=6;log(`Dug up a buried treasure on ${c.n}: ${fmt(gold)} pieces of eight!`);
  S.pieces=0;let n=S.tre;while(n===S.tre)n=ri(0,CAYS.length-1);S.tre=n;
  sheet(`<p class="eyebrow">Treasure</p><h2>X marks the spot</h2>${scn('treasure')}<p>Your lookout knows the island from the map. On ${c.n}, your shovels strike the lid of an iron-bound chest. Inside lies <b>${fmt(gold)}</b> pieces of eight in old Spanish coin.</p><div class="row"><button class="btn pri" data-a="close">Back to the chart</button></div>`);
}

/* ---------- retire / title ---------- */
function retire(){
  const ranks=NK.reduce((a,n)=>a+S.rank[n],0),bestN=NK.slice().sort((a,b)=>S.rank[b]-S.rank[a])[0];
  const wifeD=S.wife&&S.dau[S.wife.pid];
  const score=Math.round(S.personal+S.gold*.25+S.fame*120+ranks*700+(wifeD?(wifeD.beauty+1)*2000:0)+S.kids.length*900);
  const end=score<3000?'You end your days mending nets in a fishing village. The children laugh at your stories of galleons and gold.':
    score<9000?'You buy a tavern near the docks, where the drinks are watered and your tales grow taller every year.':
    score<20000?'You settle on a modest plantation and become a respected figure in the colony.':
    score<40000?`${NAT[bestN].n} names you governor of a colony. You hang pirates now, with a twinkle in your eye.`:
    'Your fortune and titles are the envy of the courts of Europe. Ballads of your exploits are sung for a hundred years.';
  const pr=S.kids.filter(k=>k.priest);
  const fam=wifeD?` ${S.wife.name} is at your side${S.kids.length?`, and ${S.kids.length} children fill your table on Sundays${pr.length?`, while ${pr[0].name} says the Mass`:''}. Your grandchildren grow up on tales of the Spanish Main.`:'.'}`:' You never married, and the house is quiet in the evenings.';
  wipe();titleOn=true;
  sheet(`<p class="eyebrow">The end of a career · ${dateStr()}</p><h2>${S.name} retires at ${age()}</h2>${scn('title')}
  <p>${end}${fam}</p>
  <dl class="stats"><dt>Fortune</dt><dd>${fmt(S.personal+S.gold*.25)} pieces of eight</dd><dt>Fame</dt><dd>${S.fame} · ${fameTitle()}</dd>
  <dt>Titles</dt><dd>${NK.filter(n=>S.rank[n]>0).map(n=>`${RANKS[S.rank[n]]} of ${NAT[n].n}`).join(', ')||'none'}</dd>
  <dt>Family</dt><dd>${wifeD?`Married to ${S.wife.name} of ${PORT[S.wife.pid].n}${S.kids.length?`, ${S.kids.length} children`:''}`:'Unmarried'}</dd>
  <dt>Record</dt><dd>${S.wins} victories, ${S.prizes} prizes, ${S.raids} towns sacked</dd><dt>Score</dt><dd>${fmt(score)}</dd></dl>
  <div class="row"><button class="btn pri" data-a="title">A new career</button></div>`);
  S=null;
}
let pickN='en',pickS='fence',pickD=1;
A.title=()=>titleScreen();
function titleScreen(){titleOn=true;
  const saved=load();
  sheet(`<p class="eyebrow">The Caribbean · 1660</p><div class="title-art">Brethren of the Coast</div>${scn('title')}
  <p class="sub">Sail the Spanish Main as a privateer. Take prizes, cross swords, sack towns, court a governor's daughter, and retire rich — if you live that long.</p>
  ${saved?`<div class="row"><button class="btn pri" data-a="cont">Continue: ${saved.name}, ${MONTHS[Math.floor(saved.day/30)%12]} ${1660+Math.floor(saved.day/360)}</button></div><h3>Or begin anew</h3>`:''}
  <label class="lbl" for="nm">YOUR NAME</label><input class="txt" id="nm" maxlength="24" value="Captain Hawkes" autocomplete="off">
  <label class="lbl">SAIL UNDER THE FLAG OF</label><div class="pick">${NK.map(n=>`<button type="button" data-a="pn" data-v="${n}" aria-pressed="${pickN===n}"><span class="flag" style="background:${NAT[n].c}"></span>${NAT[n].n}<small>Start at ${PORT[{es:'havana',en:'portroyal',fr:'tortuga',nl:'willemstad'}[n]].n}${n==='es'?' · at war with everyone':''}</small></button>`).join('')}</div>
  <label class="lbl">YOUR SPECIAL SKILL</label><div class="pick">${Object.entries(SKILLS).map(([k,s])=>`<button type="button" data-a="ps" data-v="${k}" aria-pressed="${pickS===k}">${s.n}<small>${s.d}</small></button>`).join('')}</div>
  <label class="lbl">DIFFICULTY</label><div class="pick">${DIFF.map((d,i)=>`<button type="button" data-a="pd" data-v="${i}" aria-pressed="${pickD===i}">${d.n}</button>`).join('')}</div>
  <div class="row"><button class="btn pri" data-a="start" style="min-height:52px;font-size:17px">Weigh anchor</button></div>
  <div class="row"><button class="btn" type="button" data-a="snd">${SMODES[SND.mode]}</button></div>`);
}
const keepName=()=>{const el=$('#nm');return el?el.value:''};
A.pn=v=>{const n=keepName();pickN=v;titleScreen();$('#nm').value=n;};
A.ps=v=>{const n=keepName();pickS=v;titleScreen();$('#nm').value=n;};
A.pd=v=>{const n=keepName();pickD=+v;titleScreen();$('#nm').value=n;};
A.start=()=>{const n=(keepName()||'').trim()||'Captain Hawkes';newGame(n,pickN,pickS,pickD);begin();
  sheet(`<p class="eyebrow">${dateStr()}</p><h2>Your orders</h2>${scn('cabin')}<p>${NAT[S.nat].n} has granted you a letter of marque. You command a sloop of 8 guns and 40 men, with 600 pieces of eight in the ship's purse.</p>
  <p>Hold <b>◀</b> and <b>▶</b> to steer. Your ship always runs before the wind, which now blows from the <b>${windFrom()}</b>. Sail with it or across it and you fly; turn into it and you'll hardly move. Sail into a harbor to enter port.</p>
  <p>The Main is wide and your charts are blank. Tap <b>☰ Menu</b> to pause: read your charts, which fill in as you explore, and take a sun sighting to learn your latitude.</p>
  <p>Take prizes from your nation's enemies, then visit a governor to be rewarded. Win a rank and you may be introduced to a governor's daughter. When the crew grows restless, divide the plunder.</p>
  <div class="row"><button class="btn pri" data-a="close">To sea!</button></div>`);};
A.cont=()=>{S=load();if(!S)return titleScreen();FOG=Uint8Array.from((S.fogs||'').padEnd(FW*FH,'0').slice(0,FW*FH),ch=>ch==='1'?1:0);S.seen=S.seen||{};begin();closeSheet();};
function begin(){resize();centerOn(S.x,S.y);view.follow=true;hud();}

/* ---------- captain's cabin menu ---------- */
let SX=null;
function menu(){sheet(`<p class="eyebrow">At sea · ${dateStr()}</p><h2>Captain's cabin</h2>${scn('cabin')}
  <div class="mgrid">
  <button class="btn" type="button" data-a="status">Captain's papers</button><button class="btn" type="button" data-a="log">Ship's log</button>
  <button class="btn" type="button" data-a="charts">Charts &amp; maps</button><button class="btn" type="button" data-a="sight">Take a sun sighting</button>
  <button class="btn" type="button" data-a="furl">${S.anchored?'Make sail':'Furl sails'}</button><button class="btn" type="button" data-a="snd">${SMODES[SND.mode]}</button>
  </div>
  <div class="row"><button class="btn pri" type="button" data-a="close">Back to the helm</button></div>
  <div class="row"><button class="btn" type="button" data-a="quit">Save and quit to title</button></div>`);}
A.menu=()=>menu();A.status=()=>status();A.log=()=>showLog();A.charts=()=>charts();A.sight=()=>sighting();
A.furl=()=>{S.anchored=!S.anchored;menu();};
A.snd=()=>{SND.mode=(SND.mode+1)%3;try{localStorage.setItem('brethren-sound',SND.mode)}catch(_){}
  if(S&&!titleOn)menu();else{const n=keepName();titleScreen();if($('#nm'))$('#nm').value=n||'Captain Hawkes';}};
A.quit=()=>{save();S=null;B=null;D=null;DN=null;titleScreen();};
function charts(){
  sheet(`<p class="eyebrow">Charts · ${dateStr()}</p><h2>Your charts of the Main</h2><p class="sub">Coasts appear on your chart only once you have sailed past them. Ports you have visited are named.</p>
  <canvas class="chart" id="chart" width="500" height="350"></canvas>
  <p class="note">${S.fix&&S.day-S.fix.day<=7?`Red line: your sun sighting, ${fmtLat(S.fix.lat)}.`:'Take a sun sighting to find your latitude.'} The dotted circle is your navigator's best reckoning of where you are. It grows the longer you sail without a fix.</p>
  <h3>Treasure map</h3>${S.pieces?`<canvas class="frag" id="frag" width="180" height="120"></canvas><p class="note">${S.pieces<4?`${S.pieces} of 4 pieces. Old sailors in the taverns may sell you the rest.`:`The map is whole. The X lies near ${fmtLat(latOf(CAYS[S.tre].y))}, beside a small island. Find that coast and sail close by.`}</p>`:'<p class="note">You have no pieces of a treasure map.</p>'}
  <div class="row"><button class="btn pri" type="button" data-a="menu">Back</button></div>`);
  drawChart($('#chart'));if(S.pieces)drawFragment($('#frag'));}
function sighting(){SX={t:rnd(0,6),done:false};
  sheet(`<p class="eyebrow">At sea · ${dateStr()}</p><h2>Take a sun sighting</h2><p class="sub">The ship is rolling. Tap Mark when the lower edge of the sun just touches the horizon.</p>
  <canvas class="scene" id="sx" width="160" height="90"></canvas>
  <div class="row"><button class="btn red" id="sxb" type="button" style="min-height:56px;font-size:18px">Mark</button></div>
  <p id="sxr"></p><div class="row"><button class="btn pri" type="button" data-a="menu">Back</button></div>`);
  $('#sxb').addEventListener('pointerdown',ev=>{ev.preventDefault();if(SX.done){SX.done=false;SX.t+=rnd(1,3);$('#sxb').textContent='Mark';$('#sxr').textContent='';}else markSun();});}
const sunY=t=>44+15*Math.sin(t*1.25)+5*Math.sin(t*2.7+1);
function updSextant(dt){if(!SX.done)SX.t+=dt;const el=document.getElementById('sx');if(!el)return;g=el.getContext('2d');g.imageSmoothingEnabled=false;
  Bands(0,52,['#4a8ad0',C.sky,C.sky2,C.sky3]);SeaBand(52,90,SX.t);R(0,52,SW,1,'#1a3a80');
  const y=Math.round(sunY(SX.t));Circ(80,y,6,'#ff9a3a');Circ(80,y,4,'#ffd06a');
  R(80,8,1,74,'rgba(255,255,255,.2)');
  for(let yy=0;yy<SH;yy++){const d=yy-45,hw=Math.abs(d)<40?Math.round(Math.sqrt(1600-d*d)*1.3):0;R(0,yy,80-hw,1,'#0b0b10');R(80+hw,yy,SW-80-hw,1,'#0b0b10');}
  for(let a=0;a<64;a++){const an=a/64*Math.PI*2;Pt(80+Math.cos(an)*52,45+Math.sin(an)*40,C.gold2);}}
function markSun(){if(!SX||SX.done)return;SX.done=true;const err=Math.abs(sunY(SX.t)+6-52),lat=latOf(S.y)+(Math.random()<.5?-1:1)*err*.12+rnd(-.06,.06);
  S.fix={lat,day:S.day};S.fixDay=S.day-Math.floor((S.day-S.fixDay)/2);sfx(err<2?'coin':'blip');
  $('#sxr').innerHTML=`<b>Latitude ${fmtLat(lat)}.</b> ${err<1.5?'A clean sighting. You trust it.':err<4?'A fair sighting, give or take a little.':'A poor sighting. The ship rolled as you marked it.'}<br><span class="note">The line is drawn on your charts for the next week.</span>`;
  $('#sxb').textContent='Take another';}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S){if(!paused)update(dt);if(view.follow)centerOn(S.x,S.y);draw();hud();}
  else{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#1d4aa8';ctx.fillRect(0,0,W,H);}
  if(B){if(B.mode==='assault'){updAssault(dt);drawAssault();}else{updBattle(dt);drawBattle();}}
  if(SX)updSextant(dt);
  if(liveScenes.length)drawScenes(now/1000);
  if(D)updDuel(dt);
  if(DN)updDance(dt);
  musicTick();waterTick();
  requestAnimationFrame(loop);}
resize();titleScreen();requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
})();
</script>

</body></html>
